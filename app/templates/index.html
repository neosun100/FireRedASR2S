<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireRedASR2S</title>
<style>
:root{--bg:linear-gradient(135deg,#0a0a1a,#1a0515,#0d1b2a);--surface:rgba(255,255,255,0.04);--surface2:rgba(255,255,255,0.08);--border:rgba(255,255,255,0.08);--text:#e8e8f0;--dim:#8888a0;--accent:#ef4444;--accent2:#f97316;--green:#22c55e;--blue:#3b82f6;--orange:#f59e0b;--pink:#ec4899;--cyan:#06b6d4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{text-align:center;padding:2rem 1rem 1rem;position:relative}
.title{font-size:2.2rem;font-weight:700;background:linear-gradient(135deg,#ef4444,#f97316,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 200%;animation:grad 4s ease infinite}
@keyframes grad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.subtitle{color:var(--dim);margin-top:.4rem;font-size:.9rem}
.container{max-width:960px;margin:0 auto;padding:0 1rem 2rem}
.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1.5rem}
@media(max-width:700px){.metrics-grid{grid-template-columns:repeat(2,1fr)}}
.metric-card{background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center;transition:all .3s}
.metric-card.ok{border-color:rgba(239,68,68,.3);box-shadow:0 0 20px rgba(239,68,68,.08)}
.metric-label{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.4rem}
.metric-value{font-size:1.4rem;font-weight:700;color:var(--accent)}
.metric-unit{font-size:.7rem;color:var(--dim)}
.card{background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1.25rem}
.card-title{font-size:.95rem;font-weight:600;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.form-group{margin-bottom:.75rem}
.form-label{display:block;font-size:.8rem;color:var(--dim);margin-bottom:.35rem;font-weight:500}
input,select,textarea{width:100%;padding:.6rem .75rem;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem;transition:border-color .2s}
input:focus,select:focus{outline:none;border-color:var(--accent)}
select option{background:#1a1a2e;color:var(--text)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.btn{width:100%;padding:.85rem;background:linear-gradient(135deg,#ef4444,#f97316);border:none;border-radius:10px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:.5rem}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(239,68,68,.25)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-sm{padding:.4rem .8rem;font-size:.8rem;width:auto;border-radius:6px}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:2.5rem;text-align:center;cursor:pointer;transition:all .3s;background:rgba(255,255,255,0.01)}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:rgba(239,68,68,.05)}
.upload-icon{font-size:2.5rem;margin-bottom:.5rem}
.result-text{background:rgba(255,255,255,0.03);border-radius:8px;padding:1rem;font-family:'SF Mono',monospace;white-space:pre-wrap;max-height:400px;overflow-y:auto;border:1px solid var(--border);line-height:1.7;font-size:.85rem}
.ts-item{display:inline-block;padding:2px 6px;margin:2px;border-radius:4px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);font-size:.8rem;cursor:pointer;transition:all .2s}
.ts-item:hover{background:rgba(239,68,68,.2);border-color:var(--accent)}
.ts-time{color:var(--accent);font-size:.65rem;font-family:monospace}
.status-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;padding:.6rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:1.25rem;font-size:.8rem}
.status-item{display:flex;align-items:center;gap:.4rem}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.dot.off{background:var(--dim)}
.dot.busy{background:var(--orange);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hidden{display:none}
.progress-bar{width:100%;height:3px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin-top:.75rem}
.progress-fill{height:100%;background:linear-gradient(90deg,#ef4444,#f97316);width:0%;transition:width .3s}
.lang-select{position:absolute;top:1rem;right:1rem;padding:.4rem .6rem;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.8rem}
.switch{position:relative;display:inline-block;width:40px;height:20px;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.sw-sl{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,0.1);transition:.3s;border-radius:20px}
.sw-sl:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%}
input:checked+.sw-sl{background:linear-gradient(135deg,#ef4444,#f97316)}
input:checked+.sw-sl:before{transform:translateX(20px)}
audio{width:100%;margin-top:.75rem;border-radius:8px}
.mic-btn{width:60px;height:60px;border-radius:50%;border:2px solid var(--accent);background:rgba(239,68,68,.1);color:var(--accent);font-size:1.5rem;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;margin:0 auto}
.mic-btn.recording{border-color:#ef4444;background:rgba(239,68,68,.15);animation:pulse 1s infinite}
.sentence-item{padding:.5rem .75rem;margin:.25rem 0;border-radius:6px;background:rgba(255,255,255,0.02);border-left:3px solid var(--accent);font-size:.85rem}
.sentence-meta{font-size:.7rem;color:var(--dim);margin-top:.2rem}
.collapse-header{cursor:pointer;user-select:none;display:flex;align-items:center;gap:.5rem}
.collapse-header:hover{color:var(--accent)}
.collapse-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.collapse-body.open{max-height:2000px}
input[type="range"]{-webkit-appearance:none;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;border:none;padding:0}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer}
</style>
</head>
<body>
<div class="header">
<select class="lang-select" id="uiLang" onchange="setLang(this.value)">
<option value="zh-CN">🇨🇳 简体中文</option><option value="zh-TW">🇹🇼 繁體中文</option>
<option value="en">🇺🇸 English</option><option value="ja">🇯🇵 日本語</option>
</select>
<h1 class="title">🔥 FireRedASR2S</h1>
<p class="subtitle" data-i18n="subtitle">SOTA全能语音识别 · 中文+方言+英文 · VAD+LID+ASR+标点</p>
</div>
<div class="container">
<div class="metrics-grid">
<div class="metric-card" id="mc-time"><div class="metric-label" data-i18n="m.time">处理耗时</div><div class="metric-value" id="v-time">--</div><div class="metric-unit">s</div></div>
<div class="metric-card" id="mc-dur"><div class="metric-label" data-i18n="m.dur">音频时长</div><div class="metric-value" id="v-dur">--</div><div class="metric-unit">s</div></div>
<div class="metric-card" id="mc-rtf"><div class="metric-label">RTF</div><div class="metric-value" id="v-rtf">--</div><div class="metric-unit" data-i18n="m.rtf">实时率</div></div>
<div class="metric-card" id="mc-gpu"><div class="metric-label">GPU</div><div class="metric-value" id="v-gpu">--</div><div class="metric-unit">MB</div></div>
</div>
<div class="status-bar">
<div class="status-item"><span class="dot off" id="sDot"></span><span id="sText" data-i18n="s.ready">就绪</span></div>
<div class="status-item"><span style="color:var(--dim)">GPU:</span><span id="sGpu">--</span></div>
<button class="btn-sm" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);cursor:pointer" onclick="doOffload()" data-i18n="s.release">释放显存</button>
<a href="/docs" target="_blank" style="padding:.3rem .6rem;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--dim);text-decoration:none;font-size:.75rem">📄 API Docs</a>
</div>
<div class="card">
<div class="card-title">🎵 <span data-i18n="u.title">音频输入</span></div>
<div style="display:flex;gap:1rem;align-items:center;margin-bottom:1rem">
<div style="flex:1">
<div class="upload-zone" id="upZone" onclick="document.getElementById('fileIn').click()">
<div class="upload-icon">📁</div>
<div data-i18n="u.hint">拖拽音频文件或点击上传</div>
<div style="margin-top:.3rem;font-size:.75rem;color:var(--dim)" data-i18n="u.fmt">支持 MP3 / WAV / FLAC / M4A / OGG（自动转换为16kHz）</div>
</div>
<input type="file" id="fileIn" accept="audio/*" class="hidden" onchange="handleFile(this.files[0])">
</div>
<div style="text-align:center">
<button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
<div style="font-size:.7rem;color:var(--dim);margin-top:.3rem" data-i18n="u.mic">录音</div>
</div>
</div>
<div id="fileName" class="hidden" style="text-align:center;color:var(--accent);font-size:.85rem"></div>
<audio id="audioPlayer" controls class="hidden"></audio>
</div>
<div class="card">
<div class="collapse-header" onclick="toggleCollapse('advSettings')">
<span>⚙️</span><span data-i18n="p.title">高级参数设置</span><span id="advSettingsArrow">▶</span>
</div>
<div class="collapse-body" id="advSettings">
<div style="padding-top:.75rem">
<div class="form-row">
<div class="form-group">
<label class="form-label" style="display:flex;align-items:center;gap:.75rem">
<span>🎯 VAD</span>
<label class="switch"><input type="checkbox" id="chkVad" checked><span class="sw-sl"></span></label>
</label>
</div>
<div class="form-group">
<label class="form-label" style="display:flex;align-items:center;gap:.75rem">
<span>🌐 LID</span>
<label class="switch"><input type="checkbox" id="chkLid" checked><span class="sw-sl"></span></label>
</label>
</div>
</div>
<div class="form-row">
<div class="form-group">
<label class="form-label" style="display:flex;align-items:center;gap:.75rem">
<span>📝 <span data-i18n="p.punc">标点预测</span></span>
<label class="switch"><input type="checkbox" id="chkPunc" checked><span class="sw-sl"></span></label>
</label>
</div>
<div class="form-group">
<label class="form-label">Beam Size: <span id="beamVal">3</span></label>
<input type="range" id="beamSize" min="1" max="10" value="3" oninput="document.getElementById('beamVal').textContent=this.value">
</div>
</div>
<div class="form-row">
<div class="form-group">
<label class="form-label" data-i18n="p.threshold">语音阈值: <span id="threshVal">0.2</span></label>
<input type="range" id="speechThreshold" min="0.1" max="0.9" step="0.05" value="0.2" oninput="document.getElementById('threshVal').textContent=this.value">
</div>
<div class="form-group">
<label class="form-label">Softmax Smoothing: <span id="smoothVal">1.25</span></label>
<input type="range" id="softmaxSmoothing" min="0.5" max="2.0" step="0.05" value="1.25" oninput="document.getElementById('smoothVal').textContent=this.value">
</div>
</div>
</div>
</div>
</div>
<button class="btn" id="goBtn" onclick="doTranscribe()" disabled>
<span>▶</span> <span data-i18n="btn.go">开始识别</span>
</button>
<div class="progress-bar hidden" id="progBar"><div class="progress-fill" id="progFill"></div></div>
<div class="hidden" id="resultArea">
<div class="card">
<div class="card-title">📝 <span data-i18n="r.title">识别结果</span></div>
<div id="resultText" class="result-text"></div>
<div id="sentArea" class="hidden" style="margin-top:.75rem">
<div class="card-title" style="font-size:.85rem">📋 <span data-i18n="r.sent">分句详情</span></div>
<div id="sentContent"></div>
</div>
<div id="wordArea" class="hidden" style="margin-top:.75rem">
<div class="card-title" style="font-size:.85rem">⏱️ <span data-i18n="r.words">字级时间戳</span></div>
<div id="wordContent" style="line-height:2"></div>
</div>
<div style="margin-top:.75rem;display:flex;gap:.5rem;flex-wrap:wrap">
<button class="btn btn-sm" style="flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text)" onclick="copyText()">📋 <span data-i18n="btn.copy">复制</span></button>
<button class="btn btn-sm" style="flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text)" onclick="dlJson()">📄 JSON</button>
</div>
</div>
</div>
</div>
<script>
const I={
'zh-CN':{subtitle:'SOTA全能语音识别 · 中文+方言+英文 · VAD+LID+ASR+标点','m.time':'处理耗时','m.dur':'音频时长','m.rtf':'实时率',
's.ready':'就绪','s.release':'释放显存','s.busy':'识别中...','s.done':'完成',
'u.title':'音频输入','u.hint':'拖拽音频文件或点击上传','u.fmt':'支持 MP3/WAV/FLAC/M4A/OGG（自动转换为16kHz）','u.mic':'录音',
'p.title':'高级参数设置','p.punc':'标点预测','p.threshold':'语音阈值',
'btn.go':'开始识别','btn.copy':'复制','r.title':'识别结果','r.sent':'分句详情','r.words':'字级时间戳'},
'zh-TW':{subtitle:'SOTA全能語音識別 · 中文+方言+英文 · VAD+LID+ASR+標點','m.time':'處理耗時','m.dur':'音頻時長','m.rtf':'實時率',
's.ready':'就緒','s.release':'釋放顯存','s.busy':'識別中...','s.done':'完成',
'u.title':'音頻輸入','u.hint':'拖拽音頻文件或點擊上傳','u.fmt':'支持 MP3/WAV/FLAC/M4A/OGG（自動轉換為16kHz）','u.mic':'錄音',
'p.title':'高級參數設置','p.punc':'標點預測','p.threshold':'語音閾值',
'btn.go':'開始識別','btn.copy':'複製','r.title':'識別結果','r.sent':'分句詳情','r.words':'字級時間戳'},
'en':{subtitle:'SOTA All-in-One ASR · Chinese+Dialects+English · VAD+LID+ASR+Punc','m.time':'Process Time','m.dur':'Duration','m.rtf':'Real-time Factor',
's.ready':'Ready','s.release':'Release GPU','s.busy':'Processing...','s.done':'Done',
'u.title':'Audio Input','u.hint':'Drop audio file or click to upload','u.fmt':'MP3/WAV/FLAC/M4A/OGG (auto-converted to 16kHz)','u.mic':'Record',
'p.title':'Advanced Settings','p.punc':'Punctuation','p.threshold':'Speech Threshold',
'btn.go':'Transcribe','btn.copy':'Copy','r.title':'Result','r.sent':'Sentence Details','r.words':'Word Timestamps'},
'ja':{subtitle:'SOTA全能音声認識 · 中国語+方言+英語 · VAD+LID+ASR+句読点','m.time':'処理時間','m.dur':'音声時間','m.rtf':'リアルタイム率',
's.ready':'準備完了','s.release':'GPU解放','s.busy':'処理中...','s.done':'完了',
'u.title':'音声入力','u.hint':'音声ファイルをドロップまたはクリック','u.fmt':'MP3/WAV/FLAC/M4A/OGG（自動16kHz変換）','u.mic':'録音',
'p.title':'詳細設定','p.punc':'句読点','p.threshold':'音声閾値',
'btn.go':'文字起こし','btn.copy':'コピー','r.title':'結果','r.sent':'文詳細','r.words':'単語タイムスタンプ'}
};
let lang=localStorage.getItem('firered-lang')||'zh-CN',selFile=null,curResult=null,mediaRec=null,recording=false;
function setLang(l){lang=l;localStorage.setItem('firered-lang',l);document.getElementById('uiLang').value=l;
document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.getAttribute('data-i18n');if(I[l]&&I[l][k])e.textContent=I[l][k]})}
function toggleCollapse(id){const b=document.getElementById(id),a=document.getElementById(id+'Arrow');
b.classList.toggle('open');a.textContent=b.classList.contains('open')?'▼':'▶'}
const uz=document.getElementById('upZone');
uz.ondragover=e=>{e.preventDefault();uz.classList.add('dragover')};
uz.ondragleave=()=>uz.classList.remove('dragover');
uz.ondrop=e=>{e.preventDefault();uz.classList.remove('dragover');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])};
function handleFile(f){selFile=f;
document.getElementById('fileName').textContent='📄 '+f.name+' ('+(f.size/1048576).toFixed(2)+' MB)';
document.getElementById('fileName').classList.remove('hidden');
document.getElementById('goBtn').disabled=false;
const a=document.getElementById('audioPlayer');a.src=URL.createObjectURL(f);a.classList.remove('hidden');
a.onloadedmetadata=()=>{document.getElementById('v-dur').textContent=a.duration.toFixed(1)}}
function toggleMic(){
if(recording){mediaRec.stop();return}
navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
const chunks=[];mediaRec=new MediaRecorder(s);
mediaRec.ondataavailable=e=>chunks.push(e.data);
mediaRec.onstop=()=>{s.getTracks().forEach(t=>t.stop());
const blob=new Blob(chunks,{type:'audio/webm'});
handleFile(new File([blob],'recording.webm',{type:'audio/webm'}));
document.getElementById('micBtn').classList.remove('recording');recording=false};
mediaRec.start();recording=true;document.getElementById('micBtn').classList.add('recording')
}).catch(()=>alert('Microphone access denied'))}
async function doTranscribe(){
if(!selFile)return;
const btn=document.getElementById('goBtn'),prog=document.getElementById('progBar'),dot=document.getElementById('sDot'),st=document.getElementById('sText');
btn.disabled=true;prog.classList.remove('hidden');document.getElementById('progFill').style.width='15%';
dot.className='dot busy';st.textContent=I[lang]['s.busy']||'Processing...';
const t0=performance.now(),fd=new FormData();
fd.append('file',selFile);
fd.append('enable_vad',document.getElementById('chkVad').checked);
fd.append('enable_lid',document.getElementById('chkLid').checked);
fd.append('enable_punc',document.getElementById('chkPunc').checked);
fd.append('beam_size',document.getElementById('beamSize').value);
fd.append('speech_threshold',document.getElementById('speechThreshold').value);
fd.append('softmax_smoothing',document.getElementById('softmaxSmoothing').value);
try{
document.getElementById('progFill').style.width='40%';
const res=await fetch('/api/transcribe',{method:'POST',body:fd});
document.getElementById('progFill').style.width='90%';
const data=await res.json();
if(data.error)throw new Error(data.error);
curResult=data;
document.getElementById('resultArea').classList.remove('hidden');
document.getElementById('resultText').textContent=data.text;
if(data.sentences&&data.sentences.length){
document.getElementById('sentArea').classList.remove('hidden');
document.getElementById('sentContent').innerHTML=data.sentences.map(s=>
`<div class="sentence-item"><div>${s.text}</div><div class="sentence-meta">${(s.start_ms/1000).toFixed(2)}s - ${(s.end_ms/1000).toFixed(2)}s | ${s.lang||'--'} | conf: ${s.asr_confidence||'--'}</div></div>`
).join('')}
if(data.words&&data.words.length){
document.getElementById('wordArea').classList.remove('hidden');
document.getElementById('wordContent').innerHTML=data.words.map(w=>
`<span class="ts-item" onclick="seekTo(${w.start_ms/1000})" title="${(w.start_ms/1000).toFixed(2)}s - ${(w.end_ms/1000).toFixed(2)}s"><span class="ts-time">${(w.start_ms/1000).toFixed(2)}</span> ${w.text}</span>`
).join('')}
document.getElementById('v-time').textContent=data.process_time_seconds?.toFixed(2)||'--';
document.getElementById('v-dur').textContent=data.duration_seconds?.toFixed(1)||'--';
document.getElementById('v-rtf').textContent=data.rtf?.toFixed(3)||'--';
document.querySelectorAll('.metric-card').forEach(c=>c.classList.add('ok'));
document.getElementById('progFill').style.width='100%';
dot.className='dot';st.textContent=I[lang]['s.done']||'Done';
}catch(e){st.textContent='Error: '+e.message;dot.className='dot off'}
finally{btn.disabled=false;setTimeout(()=>prog.classList.add('hidden'),800)}}
function seekTo(t){const a=document.getElementById('audioPlayer');if(a.src){a.currentTime=t;a.play()}}
function copyText(){if(curResult)navigator.clipboard.writeText(curResult.text)}
function dlJson(){if(!curResult)return;const b=new Blob([JSON.stringify(curResult,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='firered_asr_result.json';a.click()}
async function doOffload(){await fetch('/api/gpu-offload',{method:'POST'});updateStatus()}
async function updateStatus(){try{
const r=await fetch('/health'),d=await r.json();
document.getElementById('sDot').className=d.model_loaded?'dot':'dot off';
if(d.gpu){const g=d.gpu;document.getElementById('sGpu').textContent=g.memory_used_mb+'/'+g.memory_total_mb+'MB';
document.getElementById('v-gpu').textContent=g.memory_used_mb}
}catch(e){}}
setLang(lang);updateStatus();setInterval(updateStatus,5000);
</script>
</body>
</html>
